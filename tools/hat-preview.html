<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #123b4c; }
      model-viewer { width: 512px; height: 512px; --poster-color: #123b4c; background: radial-gradient(circle, #39777b 0%, #123b4c 72%); }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
  <body>
    <model-viewer id="hat" camera-controls disable-zoom environment-image="neutral" shadow-intensity="1" exposure="1.2" auto-rotate></model-viewer>
    <script>
      const model = new URLSearchParams(location.search).get('model') || 'Pirate'
      document.getElementById('hat').src = `/assets/Models/${model}.glb`
    </script>
  </body>
</html>
